<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Arial, sans-serif">
  <rect width="640" height="520" fill="#f4f6f8"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Contêiner de lixo 1000 L – PEAD (ilustração)</text>

  <!-- ground -->
  <rect x="0" y="470" width="640" height="50" fill="#d9dde1"/>

  <!-- lid -->
  <path d="M150 120 L470 120 L490 150 L130 150 Z" fill="#1f5fa8" stroke="#0e3a6b" stroke-width="3"/>
  <rect x="270" y="108" width="80" height="14" rx="5" fill="#174c87" stroke="#0e3a6b" stroke-width="2"/>

  <!-- body (tapered) -->
  <path d="M140 150 L480 150 L455 430 L165 430 Z" fill="#2a74c9" stroke="#0e3a6b" stroke-width="3"/>
  <!-- ribs -->
  <line x1="200" y1="170" x2="212" y2="415" stroke="#1f5fa8" stroke-width="6"/>
  <line x1="420" y1="170" x2="408" y2="415" stroke="#1f5fa8" stroke-width="6"/>
  <rect x="150" y="160" width="320" height="18" fill="#1f5fa8"/>

  <!-- side trunnion (munhão) with steel plate -->
  <rect x="118" y="210" width="36" height="60" fill="#9aa3ab" stroke="#555" stroke-width="2"/>
  <circle cx="112" cy="240" r="14" fill="#6d757c" stroke="#333" stroke-width="2"/>
  <rect x="486" y="210" width="36" height="60" fill="#9aa3ab" stroke="#555" stroke-width="2" transform="translate(-20,0)"/>
  <circle cx="508" cy="240" r="14" fill="#6d757c" stroke="#333" stroke-width="2"/>

  <!-- front handle -->
  <rect x="250" y="190" width="120" height="14" rx="7" fill="#174c87"/>

  <!-- drain -->
  <circle cx="310" cy="412" r="9" fill="#111" stroke="#666" stroke-width="2"/>

  <!-- wheels -->
  <rect x="180" y="430" width="30" height="16" fill="#555"/>
  <rect x="410" y="430" width="30" height="16" fill="#555"/>
  <circle cx="195" cy="455" r="16" fill="#222"/><circle cx="195" cy="455" r="6" fill="#999"/>
  <circle cx="425" cy="455" r="16" fill="#222"/><circle cx="425" cy="455" r="6" fill="#999"/>

  <!-- callouts -->
  <g font-size="13" fill="#222" stroke="#c0392b" stroke-width="1.5">
    <line x1="490" y1="135" x2="560" y2="95"/>
    <line x1="530" y1="240" x2="570" y2="240"/>
    <line x1="140" y1="260" x2="60" y2="320"/>
    <line x1="318" y1="412" x2="380" y2="495"/>
    <line x1="195" y1="471" x2="120" y2="500"/>
  </g>
  <g font-size="13" fill="#222">
    <text x="512" y="88">Tampa (sem pedal)</text>
    <text x="574" y="236">Munhão</text>
    <text x="574" y="252">basculamento</text>
    <text x="8" y="336">Reforço em</text>
    <text x="8" y="352">chapa de aço</text>
    <text x="384" y="510">Dreno c/ tampa rosqueável</text>
    <text x="10" y="510">Rodízios</text>
  </g>
  <text x="320" y="300" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff" opacity="0.85">1000 L</text>
  <text x="320" y="325" text-anchor="middle" font-size="14" fill="#ffffff" opacity="0.85">PEAD c/ proteção UV · 450 kg</text>
</svg>
